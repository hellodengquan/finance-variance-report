# ============================================================
# 财务差异报告 - 运营可配置模板
# 运营团队可直接编辑本文件，无需修改代码
# ============================================================

# -------- 成因模板：简洁格式推荐 --------
# 键名仅限: revenue_unfavorable / revenue_favorable
#           cost_unfavorable    / cost_favorable
#           (拼写错误会产生运行时警告并回退到默认模板)
revenue_unfavorable:
  - "【待核实】市场需求下降，实际销量低于预期"
  - "【待核实】产品定价策略调整，客单价下降"
  - "【待核实】主要客户流失或订单延迟确认"
  - "【待核实】季节性因素影响本期收入确认"
  - "【待核实】营销推广转化率不及预期"

revenue_favorable:
  - "【待核实】市场推广活动效果超预期，新增客户贡献显著"
  - "【待核实】高毛利产品销售占比提升"
  - "【待核实】本期确认了往期延迟的大额订单"
  - "【待核实】产品成功提价且销量未受明显影响"

cost_unfavorable:
  - "【待核实】原材料价格上涨超出预算"
  - "【待核实】产能利用率不足导致单位固定成本上升"
  - "【待核实】一次性费用支出或预算外开支"
  - "【待核实】人员成本增加（新增编制/加班/奖金）"
  - "【待核实】供应商提价未做预算调整"

cost_favorable:
  - "【待核实】供应链优化或集中采购降低了原材料成本"
  - "【待核实】费用管控措施见效，各项开支节约"
  - "【待核实】部分预算内项目延期至下期执行"
  - "【待核实】产能利用率提升摊薄了单位固定成本"

# -------- Excel 企业色配置（运营可改公司 VI 色） --------
# 三档阈值（0~1之间的比率，如 0.05 = 5%）
# 每档均含 bg（单元格背景色）和 font（字体色）
excel_colors:
  level1_threshold: 0.05
  level2_threshold: 0.10
  level3_threshold: 0.20

  favorable_level1_bg: "#E8F5E9"
  favorable_level1_font: "#2E7D32"
  favorable_level2_bg: "#A5D6A7"
  favorable_level2_font: "#1B5E20"
  favorable_level3_bg: "#43A047"
  favorable_level3_font: "#FFFFFF"

  unfavorable_level1_bg: "#FFEBEE"
  unfavorable_level1_font: "#C62828"
  unfavorable_level2_bg: "#EF9A9A"
  unfavorable_level2_font: "#7F0000"
  unfavorable_level3_bg: "#E53935"
  unfavorable_level3_font: "#FFFFFF"

  neutral_bg: "#FFFFFF"
  neutral_font: "#212121"

note: |
  【运营说明】
  1. 新增成因模板时请保留【待核实】前缀，便于人工复核
  2. 键名写错（如 revenue_unfavorabl 少字母）会产生警告
  3. Excel 颜色请使用 6 位 HEX，建议与企业 VI 一致
  4. 修改本文件后重新生成报告即可生效，无需重启服务
