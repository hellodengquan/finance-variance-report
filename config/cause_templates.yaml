cause_templates:
  revenue_positive:
    description: 收入类科目有利差异（实际>预算）
    templates:
      - "【待核实】市场需求超预期增长，销售表现优于预算"
      - "【待核实】新产品/服务推广效果显著，带动收入增长"
      - "【待核实】主要客户订单增加或新增大客户"
      - "【待核实】产品定价策略调整带来溢价"
      - "【待核实】季节性因素或行业周期影响"
      - "【待核实】营销活动转化效果超预期"
      - "【待核实】竞争对手市场份额下降"

  revenue_negative:
    description: 收入类科目不利差异（实际<预算）
    templates:
      - "【待核实】市场竞争加剧，销售未达预期"
      - "【待核实】产品交付延迟或质量问题导致收入确认延后"
      - "【待核实】主要客户需求下降或流失"
      - "【待核实】促销活动效果不及预期"
      - "【待核实】宏观经济环境或政策变化影响"
      - "【待核实】产品定价竞争力不足"
      - "【待核实】渠道拓展进度缓慢"

  cost_positive:
    description: 成本/费用类科目超支（实际>预算）
    templates:
      - "【待核实】原材料采购价格上涨超出预期"
      - "【待核实】业务规模扩张导致相关成本增加"
      - "【待核实】低效运营或浪费导致成本超支"
      - "【待核实】意外支出或一次性费用发生"
      - "【待核实】供应商议价能力变化或合同条款调整"
      - "【待核实】人力成本超预算（加班/新增人员）"
      - "【待核实】通胀因素导致物价普遍上涨"

  cost_negative:
    description: 成本/费用类科目节省（实际<预算）
    templates:
      - "【待核实】成本控制措施见效，采购价格下降"
      - "【待核实】业务量低于预期导致变动成本减少"
      - "【待核实】运营效率提升带来成本节约"
      - "【待核实】预算编制偏保守，实际支出优化"
      - "【待核实】费用延后确认或计入期间调整"
      - "【待核实】外包/替代方案降低了成本"
      - "【待核实】库存管理优化减少损耗"

actions:
  favorable_summary:
    - "对于重大有利差异，需总结经验并考虑是否调整后续预算"
    - "识别最佳实践并在组织内推广复用"
    - "评估是否可将结余资源调配至其他高优先级项目"

  unfavorable_summary:
    - "对于重大不利差异，需制定相应的改进措施和时间节点"
    - "明确责任人并建立跟踪机制"
    - "必要时启动成本控制专项行动"
    - "考虑重新评估预算假设的合理性"

note: "运营团队可根据行业特性和业务场景自由编辑以上模板，无需修改代码"
